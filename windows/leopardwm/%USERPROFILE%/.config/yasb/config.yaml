# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Generated by YASB GUI v0.0.7
# Last edited: Jul 20, 2026 10:00
# https://github.com/amnweb/yasb-gui

watch_stylesheet: false
watch_config: false
debug: false
update_check: false  # 60-min interval (hardcoded)

bars:
  primary-bar:
    enabled: true
    screens:
      - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: false
      duration: 300
    blur_effect:
      enabled: false
      round_corners: false
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 24
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
        - home
        - quick_launch
        - leopardwm_indicators
        - active_window
      center: []
      right:
        #- notifications
        #- volume
        #- clock
        - power_menu
widgets:
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
        - title: User Home
          path: '~'
        - title: Desktop
          path: '~\Desktop'
        - title: Download
          path: ~\Downloads
        - title: Documents
          path: ~\Documents
        - title: OneDrive Documents
          path: ~\OneDrive - NVIDIA Corporation\Documents
      system_menu: true
      power_menu: true
      blur: false
      round_corners: false
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12

  quick_launch:
    type: yasb.quick_launch.QuickLaunchWidget
    options:
      label: "<span>\uE71E</span>"
      search_placeholder: Search applications...
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: '*'
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: false
        round_corners: false
        round_corners_type: normal
        border_color: system
        dark_mode: true
      callbacks:
        on_left: toggle_quick_launch
      keybindings:
        - keys: alt+space
          action: toggle_quick_launch
          screen: cursor

  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_icon: true
      label_icon_size: 12
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\u23FB"
      uptime: false
      show_user: true
      menu_style: "popup"
      blur: false
      blur_background: false
      profile_image_size: 80
      buttons:
        lock: ["\uea75", "Lock"]
        sleep: ["\u23fe", "Sleep"]
        signout: ["\udb80\udf43", "Sign out"]
        hibernate: ["\uf28e", "Hibernate"]
        restart: ["\uead2", "Restart"]
        shutdown: ["\uf011", "Shut Down"]
        cancel: ["", "Cancel"]


  clock:
    type: yasb.clock.ClockWidget
    options:
      label: "<span>{icon}</span> <span>{alarm}</span> {%a %d-%b-%Y  %I:%M %p}"

  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"

  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\uF2A5</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing



  ###########################################################################
  # HAHA: my custom widgets
  ###########################################################################
  leopardwm_indicators:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span class='icon'></span> 🖥{data}"
      class_name: "leopardwm-indicators"
      exec_options:
        #run_cmd: 'powershell.exe -NoLogo -NoProfile -NonInteractive -File %USERPROFILE%\\.config\\yasb\\leopardwm_indicators.ps1'
        run_cmd: 'powershell.exe -NoLogo -NoProfile -NonInteractive -File C:\\sw\\leopardwm_indicators.ps1'
        run_interval: 1000
        return_format: "string"
      callbacks:
        on_left: "exec lwm toggle-new-window-placement"
