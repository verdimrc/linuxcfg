config_version = 15

[accessibility]
ui_scale = 1.5000000149011612

[bar.default]
center = []
concave_edge_corners = false
end = [ "tray", "notifications", "network", "bluetooth", "volume", "clock", "bar", "session" ]
font_scale = 1.2499999795109034
margin_ends = 0
radius = 6
scale = 1.2500000111758709
shadow = false
start = [ "launcher", "sway-mode", "workspaces", "spacer_2", "taskbar" ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "clock_main" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.clock_main]
    box_height = 0.0
    box_width = 0.0
    cx = 0.0
    cy = 0.0
    output = "DP-1"
    placement_height = 3840.0
    placement_width = 2160.0
    rotation = 0.0
    type = "clock"

[lockscreen]
transition = [ "disc", "fade", "stripes", "wipe", "zoom" ]
transition_duration = 700

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1932.5
    output = "DP-1"
    placement_height = 3840.0
    placement_width = 2160.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
orientation = "vertical"
position = "top_right"
position_vertical = "center_right"

    [osd.kinds]
    lock_keys = false

[plugin_settings."ezequiel/mango_layouts"]
list_mode = true
panel_open_near_click = true
panel_position = "top_left"

[plugin_settings."noctalia/world_clock"]
panel_placement = "floating"
panel_position = "top_right"

[plugins]
enabled = [ "noctalia/world_clock", "ismay/sway-mode" ]

[shell]
clipboard_confirm_clear_history = false
clipboard_enabled = false
clipboard_history_max_entries = 10
date_format = "%a %d-%b-%Y"
font_family = "Ubuntu"

    [shell.animation]
    enabled = false

    [shell.launcher]
    fetch_exchange_rates = false

    [shell.panel]
    clipboard_position = "top_right"
    control_center_placement = "floating"
    control_center_position = "top_right"
    launcher_placement = "attached"
    open_near_click_launcher = true
    polkit_placement = "attached"
    session_placement = "floating"
    session_position = "top_right"
    shadow = false

    [shell.session]
    grid = true

[system.monitor]
enabled = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "light"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
enabled = false

[widget.bar]
scale = 1.3
type = "noctalia/world_clock:bar"

[widget.bluetooth]
scale = 1.4000000000000001

[widget.clock]
font_scale = 0.90000000000000013
format = "  {:%a %d-%b-%Y  %H:%M}  "

[widget.network]
font_scale = 0.65000000000000002
scale = 1.4000000000000001

[widget.notifications]
scale = 1.4000000000000001

[widget.session]
scale = 1.4000000000000001

[widget.spacer_2]
type = "spacer"

[widget.sway-mode]
type = "ismay/sway-mode:sway-mode"

[widget.taskbar]
inactive_opacity = 0.69999999999999996
scale = 1.25

[widget.tray]
enabled = false
scale = 1.2

[widget.volume]
font_scale = 0.63
mute_color = "on_surface"
scale = 1.4000000000000001